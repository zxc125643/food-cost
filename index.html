<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品成本计算器</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2129;
    --card2: #212a35;
    --border: #2d3a48;
    --text: #e8edf2;
    --muted: #8b98a5;
    --accent: #f5c542;
    --good: #6ee7a0;
    --bad: #ff7b7b;
    --blue: #64b5f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-title .num {
    background: var(--accent);
    color: #1a1a1a;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  input, select {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .mat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .mat-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .mat-group .mg-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .mat-group .mg-title {
    font-size: 14px; font-weight: 700; color: var(--accent);
    cursor: grab;
  }
  .mat-group .mg-title:active { cursor: grabbing; }
  .mat-group .mg-subtotal {
    font-size: 13px; color: var(--good); font-weight: 600;
  }
  .mat-group .mg-body {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .mat-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    cursor: grab;
  }
  .mat-card:active { cursor: grabbing; }
  .mat-card.drag-over, .mat-group.drag-over { border-color: var(--accent); }
  .drag-handle {
    cursor: grab; color: var(--muted); font-size: 14px;
    padding: 2px 4px; user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .mat-card .mat-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mat-card .mat-group-sel {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    max-width: 80px;
  }
  .mat-card .mat-name {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    font-size: 15px;
    font-weight: 600;
    padding: 2px 0;
  }
  .mat-card .mat-name:hover, .mat-card .mat-name:focus {
    border-bottom-color: var(--accent);
    background: transparent;
  }
  .del-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .del-btn:hover { color: var(--bad); background: rgba(255,123,123,0.1); }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field .unit-wrap { display: flex; align-items: center; gap: 6px; }
  .field .unit-wrap select { width: 72px; flex-shrink: 0; }
  .field .unit-wrap input { flex: 1; min-width: 0; }
  .unit-suffix { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .unit-price {
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
  }
  .add-btn {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .product-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .product-bar select { width: auto; min-width: 140px; }
  .btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .btn-danger { color: var(--bad); border-color: rgba(255,123,123,0.4); }
  .btn-danger:hover { background: rgba(255,123,123,0.1); border-color: var(--bad); }
  .btn-good { color: var(--good); border-color: rgba(110,231,160,0.4); }
  .btn-good:hover { background: rgba(110,231,160,0.1); border-color: var(--good); }
  .spec-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .spec-tag {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 4px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spec-tag input {
    width: 60px;
    padding: 2px 6px;
    font-size: 13px;
    text-align: center;
  }
  .spec-tag .x { cursor: pointer; color: var(--muted); font-size: 14px; }
  .spec-tag .x:hover { color: var(--bad); }
  .spec-tag .mv {
    cursor: pointer; color: var(--muted); font-size: 13px;
    padding: 0 3px; user-select: none;
  }
  .spec-tag .mv:hover { color: var(--accent); }
  .spec-tag .mv:disabled { opacity: 0.3; cursor: default; }
  .batch-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .batch-row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .batch-row input {
    width: 90px; text-align: center; font-size: 16px; font-weight: 700;
  }
  .batch-row .batch-unit { color: var(--muted); font-size: 13px; }
  .spec-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .spec-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .spec-card .sc-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .spec-card .sc-head .x:hover { color: var(--bad); }
  .spec-card .sc-title { font-size: 15px; font-weight: 700; color: var(--accent); }
  .spec-card .sc-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; font-size: 13px; gap: 8px;
  }
  .spec-card .sc-row .sc-name {
    flex: 1; color: var(--text);
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spec-card .sc-row .sc-inputs {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .spec-card .sc-row input {
    width: 76px; padding: 4px 6px; text-align: center; font-size: 13px;
  }
  .spec-card .sc-row .sc-gram { color: var(--muted); font-size: 12px; }
  .spec-card .sc-row .sc-batch { color: var(--good); font-size: 11px; white-space: nowrap; }
  .spec-card .sc-row .sc-cost { color: var(--accent); font-size: 12px; white-space: nowrap; }
  .spec-card .sc-group { margin-bottom: 8px; }
  .spec-card .sc-group-title {
    font-size: 12px; font-weight: 700; color: var(--accent);
    padding: 4px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .spec-card .sc-group-subtotal {
    font-size: 12px; color: var(--muted); padding: 4px 0;
    border-top: 1px dashed var(--border); margin-top: 4px;
  }
  .spec-card .sc-total {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700;
  }
  .spec-card .sc-total .sc-t-label { font-size: 13px; color: var(--muted); }
  .spec-card .sc-total .sc-t-val { font-size: 16px; color: var(--good); }
  .spec-card .sc-total .sc-t-val small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .matrix-wrap { overflow-x: auto; }
  table.matrix {
    border-collapse: collapse;
    width: 100%;
    min-width: 400px;
  }
  table.matrix th, table.matrix td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    font-size: 13px;
  }
  table.matrix th {
    background: var(--card2);
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }
  table.matrix td.mat-name-cell { text-align: left; font-weight: 600; white-space: nowrap; }
  table.matrix input {
    width: 72px;
    padding: 5px 6px;
    text-align: center;
    font-size: 13px;
  }
  table.matrix td.cost-cell { color: var(--accent); font-weight: 600; white-space: nowrap; }
  table.matrix tr.total-row td {
    background: rgba(100,181,246,0.1);
    font-weight: 700;
  }
  table.matrix tr.total-row td.cost-cell { color: var(--good); font-size: 15px; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .summary-item {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .summary-item .spec { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .summary-item .cost { font-size: 22px; font-weight: 700; color: var(--accent); }
  .summary-item .cost small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .summary-item.lowest { border-color: var(--good); background: rgba(110,231,160,0.08); }
  .summary-item.lowest .cost { color: var(--good); }
  .summary-item .badge {
    display: inline-block;
    font-size: 10px;
    background: var(--good);
    color: #1a1a1a;
    border-radius: 8px;
    padding: 1px 8px;
    margin-top: 6px;
    font-weight: 700;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .save-hint { font-size: 12px; color: var(--muted); }
  .empty-tip { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .card { padding: 12px; }
    .mat-grid { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
    input, select { font-size: 16px; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .summary-item .cost { font-size: 26px; }
    
    /* 用量卡片：1 列，物料行换行 */
    .spec-cards { grid-template-columns: 1fr; gap: 10px; }
    .spec-card { padding: 10px; }
    .spec-card .sc-row { 
      flex-wrap: wrap; 
      gap: 6px;
      padding: 8px 0;
    }
    .spec-card .sc-row .sc-name { 
      flex: 1 1 100%; 
      font-size: 14px;
      margin-bottom: 4px;
    }
    .spec-card .sc-row .sc-inputs { 
      flex: 1 1 100%; 
      justify-content: flex-start;
      gap: 10px;
    }
    .spec-card .sc-row input { 
      width: 80px; 
      padding: 8px 10px; 
      font-size: 15px;
    }
    .spec-card .sc-row .sc-gram { font-size: 13px; }
    .spec-card .sc-row .sc-batch { font-size: 12px; }
    .spec-card .sc-row .sc-cost { font-size: 14px; }
    
    /* 规格标签：横向滚动 */
    .spec-tags { 
      flex-wrap: nowrap; 
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .spec-tag { flex-shrink: 0; }
    
    /* 物料分组：优化间距 */
    .mat-group { padding: 10px; }
    .mat-group .mg-body { gap: 8px; }
    .mat-card { padding: 10px; }
    .mat-card .mat-head { gap: 6px; }
    .mat-card .mat-name { font-size: 15px; }
    .mat-card .mat-group-sel { font-size: 14px; padding: 6px 8px; }
    .mat-card .del-btn { font-size: 18px; padding: 4px 8px; }
    .mat-card .field input { padding: 8px 10px; font-size: 15px; }
    
    /* 按钮：加大触摸目标 */
    .add-btn { padding: 10px 16px; font-size: 14px; }
    .batch-row input { width: 100px; padding: 8px 10px; }
    
    /* 汇总卡片：加大数字 */
    .summary-item { padding: 10px; }
    .summary-item .spec { font-size: 14px; }
    .summary-item .cost { font-size: 28px; }
    
    /* 弹窗移动端适配 */
    .modal-box { 
      width: 95%; 
      padding: 16px; 
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; margin-bottom: 12px; }
    .modal-body { font-size: 13px; margin-bottom: 14px; }
    .modal-opt { padding: 14px 16px; font-size: 14px; }
    .modal-input-row input { padding: 12px; font-size: 16px; }
    .modal-btn { padding: 12px 20px; font-size: 14px; }
  }
  /* 自定义模态弹窗 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.25s ease;
  }
  .modal-title {
    font-size: 16px; font-weight: 700; color: var(--text);
    margin-bottom: 16px;
  }
  .modal-body {
    font-size: 14px; color: var(--muted);
    margin-bottom: 20px; line-height: 1.6;
  }
  .modal-options {
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 20px;
  }
  .modal-opt {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px; color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
  }
  .modal-opt:hover {
    border-color: var(--accent);
    background: rgba(255,209,102,0.08);
  }
  .modal-opt:active { transform: scale(0.98); }
  .modal-opt .opt-num {
    display: inline-block;
    width: 22px; height: 22px;
    background: var(--accent);
    color: #1a1a2e;
    border-radius: 50%;
    text-align: center; line-height: 22px;
    font-weight: 700; font-size: 12px;
    margin-right: 8px;
  }
  .modal-input-row {
    display: flex; gap: 8px; margin-bottom: 20px;
  }
  .modal-input-row input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px; color: var(--text);
  }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s ease;
  }
  .modal-btn.primary {
    background: var(--accent);
    color: #1a1a2e;
  }
  .modal-btn.primary:hover { filter: brightness(1.1); }
  .modal-btn.secondary {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-btn.secondary:hover { border-color: var(--muted); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<h1>🥟 食品成本计算器</h1>
<div class="sub">物料价格全局共享 · 每个产品独立配方 · 成本自动计算</div>

<div class="toolbar">
  <span class="save-hint" id="saveHint">未保存</span>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-good" onclick="exportExcel()">导出Excel</button>
    <button class="btn btn-danger" onclick="clearAll()">清空重填</button>
  </div>
</div>

<!-- ① 产品选择 -->
<div class="card">
  <div class="card-title"><span class="num">①</span> 产品</div>
  <div class="product-bar">
    <select id="productSelect" onchange="switchProduct(this.value)"></select>
    <button class="btn btn-primary" onclick="newProduct()">+ 新建产品</button>
    <button class="btn btn-danger" onclick="deleteProduct()">删除当前产品</button>
  </div>
</div>

<!-- ② 物料价格（全局共享） -->
<div class="card">
  <div class="card-title"><span class="num">②</span> 物料价格（全局共享，所有产品通用）
    <button class="add-btn" style="margin-left:auto;padding:4px 10px;font-size:12px" onclick="manageGroups()">⚙ 管理分组</button>
  </div>
  <div class="mat-grid" id="matGrid"></div>
  <button class="add-btn" style="margin-top:10px" onclick="addMaterial()">+ 添加物料</button>
</div>

<!-- ③ 产品配方 -->
<div class="card" id="recipeCard">
  <div class="card-title"><span class="num">③</span> 当前产品配方</div>
  <div class="field" style="margin-bottom:12px;max-width:300px">
    <label>产品名称</label>
    <input id="productName" onchange="onProductNameChange(this.value)">
  </div>
  <div class="field" style="margin-bottom:12px">
    <label>规格（可增删，单位克）</label>
    <div class="spec-tags" id="specTags" style="margin-top:6px"></div>
  </div>
  <button class="add-btn" style="margin-bottom:12px" onclick="addSpec()">+ 添加规格</button>
  <div class="batch-row">
    <label>要做多少个：</label>
    <input type="number" id="batchCount" min="1" step="1" value="1" oninput="onBatchChange(this.value)">
    <span class="batch-unit">个（批量采购量 = 单个用量 × 数量）</span>
  </div>
  <div class="field" style="margin-bottom:8px">
    <label>各规格用量（克）— 每个规格一张卡，填单个用量</label>
  </div>
  <div class="spec-cards" id="specCards"></div>
</div>

<!-- ④ 成本汇总 -->
<div class="card">
  <div class="card-title"><span class="num">④</span> 单个成本汇总</div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<script>
// ================= 数据 =================
let materials = {};   // { key: {name, unit, price, weight, group} }
let matGroups = [];   // ["饼皮", "内馅", "其他"] — 分组顺序
let products = {};    // { key: {name, specs: [], usage: {spec: {matKey: grams}}} }
let currentProduct = null;
let saveTimer = null;

const UNITS = ["袋","瓶","罐","盒","桶","包","支","条"];

// ================= 持久化 =================
function scheduleSave() {
  const hint = document.getElementById("saveHint");
  hint.textContent = "保存中...";
  hint.style.color = "var(--accent)";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 800);
}

async function saveAll() {
  try {
    await fetch("/api/materials", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(materials)
    });
    await fetch("/api/products", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(products)
    });
    const hint = document.getElementById("saveHint");
    hint.textContent = "已保存到服务器";
    hint.style.color = "var(--good)";
  } catch (e) {
    // 离线降级 localStorage
    try {
      localStorage.setItem("foodcost_materials", JSON.stringify(materials));
      localStorage.setItem("foodcost_products", JSON.stringify(products));
      const hint = document.getElementById("saveHint");
      hint.textContent = "已存本地（服务器不可达）";
      hint.style.color = "var(--accent)";
    } catch (e2) {}
  }
}

async function loadAll() {
  try {
    const [rm, rp] = await Promise.all([
      fetch("/api/materials").then(r => r.json()),
      fetch("/api/products").then(r => r.json())
    ]);
    materials = rm || {};
    products = rp || {};
  } catch (e) {
    // 离线降级
    try {
      materials = JSON.parse(localStorage.getItem("foodcost_materials") || "{}");
      products = JSON.parse(localStorage.getItem("foodcost_products") || "{}");
    } catch (e2) { materials = {}; products = {}; }
  }
  // 从现有物料推导分组顺序
  matGroups = [];
  for (const k of Object.keys(materials)) {
    const g = materials[k].group || "其他";
    if (!matGroups.includes(g)) matGroups.push(g);
  }
  const keys = Object.keys(products);
  currentProduct = keys[0] || null;
  renderAll();
}

// ================= 渲染 =================
function renderAll() {
  renderProductSelect();
  renderMaterials();
  renderRecipe();
  calc();
}

function renderProductSelect() {
  const sel = document.getElementById("productSelect");
  sel.innerHTML = "";
  for (const [k, p] of Object.entries(products)) {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = p.name || "未命名";
    if (k === currentProduct) opt.selected = true;
    sel.appendChild(opt);
  }
  if (!currentProduct) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "（无产品，点新建）";
    sel.appendChild(opt);
  }
}

function renderMaterials() {
  const grid = document.getElementById("matGrid");
  grid.innerHTML = "";
  const keys = Object.keys(materials);
  if (keys.length === 0) {
    grid.innerHTML = '<div class="empty-tip">还没有物料，点下面"添加物料"</div>';
    return;
  }
  // 按分组渲染
  const groups = matGroups.length ? matGroups : ["其他"];
  for (const g of groups) {
    const gMats = keys.filter(k => (materials[k].group || "其他") === g);
    if (gMats.length === 0 && g !== "其他") continue;
    const gDiv = document.createElement("div");
    gDiv.className = "mat-group";
    gDiv.dataset.group = g;
    gDiv.draggable = true;
    gDiv.ondragstart = (e) => { e.dataTransfer.setData("text/group", g); };
    gDiv.ondragover = (e) => { e.preventDefault(); gDiv.classList.add("drag-over"); };
    gDiv.ondragleave = () => { gDiv.classList.remove("drag-over"); };
    gDiv.ondrop = (e) => {
      e.preventDefault();
      gDiv.classList.remove("drag-over");
      const g2 = e.dataTransfer.getData("text/group");
      const k = e.dataTransfer.getData("text/mat");
      if (g2 && g2 !== g) {
        // 分组拖到另一个分组
        const from = matGroups.indexOf(g2);
        const to = matGroups.indexOf(g);
        if (from >= 0 && to >= 0) {
          matGroups.splice(from, 1);
          matGroups.splice(to, 0, g2);
          scheduleSave(); renderMaterials();
        }
      } else if (k) {
        // 物料拖到分组
        materials[k].group = g;
        scheduleSave(); renderMaterials(); calc();
      }
    };
    let subtotal = 0;
    for (const k of gMats) {
      const up = unitPrice(k);
      if (up) subtotal += up;
    }
    gDiv.innerHTML = `
      <div class="mg-head">
        <span class="mg-title"><span class="drag-handle">⠿</span> ${esc(g)}</span>
        <span class="mg-subtotal" id="gsub-${esc(g)}"></span>
      </div>
      <div class="mg-body"></div>
    `;
    const body = gDiv.querySelector(".mg-body");
    for (const k of gMats) {
      const m = materials[k];
      const div = document.createElement("div");
      div.className = "mat-card";
      div.dataset.mat = k;
      div.draggable = true;
      div.ondragstart = (e) => { e.dataTransfer.setData("text/mat", k); };
      div.ondragover = (e) => { e.preventDefault(); div.classList.add("drag-over"); };
      div.ondragleave = () => { div.classList.remove("drag-over"); };
      div.ondrop = (e) => {
        e.preventDefault();
        div.classList.remove("drag-over");
        const k2 = e.dataTransfer.getData("text/mat");
        if (k2 && k2 !== k) {
          // 交换位置
          const newOrder = Object.keys(materials);
          const i1 = newOrder.indexOf(k), i2 = newOrder.indexOf(k2);
          newOrder[i1] = k2; newOrder[i2] = k;
          const reordered = {};
          for (const key of newOrder) reordered[key] = materials[key];
          materials = reordered;
          scheduleSave(); renderMaterials(); calc();
        }
      };
      div.innerHTML = `
        <div class="mat-head">
          <span class="drag-handle">⠿</span>
          <input class="mat-name" value="${esc(m.name)}" placeholder="物料名称"
                 onchange="materials['${k}'].name=this.value;scheduleSave();calc()">
          <select class="mat-group-sel" onchange="changeGroup('${k}',this.value)" title="分组">
            ${matGroups.map(g => `<option ${(m.group||"其他")===g?"selected":""}>${esc(g)}</option>`).join("")}
          </select>
          <button class="del-btn" title="同步用量到所有规格" onclick="syncMaterialUsage('${k}')">⇄</button>
          <button class="del-btn" title="删除物料" onclick="deleteMaterial('${k}')">✕</button>
        </div>
        <div class="field-row">
          <div class="field">
            <label>购买单位</label>
            <div class="unit-wrap">
              <select onchange="materials['${k}'].unit=this.value;scheduleSave()">
                ${UNITS.map(u => `<option ${m.unit===u?"selected":""}>${u}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field">
            <label>每份价格（元）</label>
            <input type="number" step="0.01" min="0" value="${m.price||""}" placeholder="0.00"
                   oninput="materials['${k}'].price=this.value;scheduleSave();calc()">
          </div>
        </div>
        <div class="field">
          <label>每份净含量（克）</label>
          <input type="number" step="1" min="0" value="${m.weight||""}" placeholder="0"
                 oninput="materials['${k}'].weight=this.value;scheduleSave();calc()">
        </div>
        <div class="unit-price" id="up-${k}"></div>
      `;
      body.appendChild(div);
    }
    grid.appendChild(gDiv);
  }
  updateUnitPrices();
  updateGroupSubtotals();
}

function updateGroupSubtotals() {
  const groups = matGroups.length ? matGroups : ["其他"];
  for (const g of groups) {
    const el = document.getElementById("gsub-" + g);
    if (!el) continue;
    let subtotal = 0;
    let hasPrice = false;
    for (const k of Object.keys(materials)) {
      if ((materials[k].group || "其他") !== g) continue;
      const up = unitPrice(k);
      if (up) { subtotal += up; hasPrice = true; }
    }
    el.textContent = hasPrice ? `单价合计: ${subtotal.toFixed(4)} 元/克` : "";
  }
}

function unitPrice(k) {
  const m = materials[k];
  const p = parseFloat(m.price), w = parseFloat(m.weight);
  if (!p || !w || w <= 0) return null;
  return p / w;
}

function updateUnitPrices() {
  for (const k of Object.keys(materials)) {
    const el = document.getElementById("up-" + k);
    if (!el) continue;
    const up = unitPrice(k);
    el.textContent = up ? `折算单价：${up.toFixed(4)} 元/克（${(up*500).toFixed(2)} 元/斤）` : "折算单价：—";
  }
}

function renderRecipe() {
  const nameInput = document.getElementById("productName");
  const specTags = document.getElementById("specTags");
  const p = currentProduct ? products[currentProduct] : null;

  if (!p) {
    nameInput.value = "";
    specTags.innerHTML = "";
    document.getElementById("specCards").innerHTML = '<div class="empty-tip">先新建一个产品</div>';
    return;
  }
  nameInput.value = p.name || "";

  // 规格标签（带排序按钮）
  specTags.innerHTML = "";
  p.specs.forEach((s, idx) => {
    const tag = document.createElement("div");
    tag.className = "spec-tag";
    tag.innerHTML = `
      <span class="mv" ${idx===0?"disabled":""} onclick="moveSpec('${esc(s)}',-1)" title="左移">←</span>
      <input value="${esc(s)}" onchange="renameSpec('${esc(s)}',this.value)">
      <span class="mv" ${idx===p.specs.length-1?"disabled":""} onclick="moveSpec('${esc(s)}',1)" title="右移">→</span>
      <span class="x" onclick="deleteSpec('${esc(s)}')" title="删除规格">✕</span>
    `;
    specTags.appendChild(tag);
  });

  // 用量卡片（每个规格一张卡，物料按分组排列）
  const matKeys = Object.keys(materials);
  const cards = document.getElementById("specCards");
  if (matKeys.length === 0 || p.specs.length === 0) {
    cards.innerHTML = '<div class="empty-tip">需要至少1个物料和1个规格</div>';
    return;
  }
  cards.innerHTML = "";
  const groups = matGroups.length ? matGroups : ["其他"];
  for (const s of p.specs) {
    const card = document.createElement("div");
    card.className = "spec-card";
    let rows = "";
    for (const g of groups) {
      const gMats = matKeys.filter(mk => (materials[mk].group || "其他") === g);
      if (gMats.length === 0) continue;
      rows += `<div class="sc-group"><div class="sc-group-title">${esc(g)}</div>`;
      for (const mk of gMats) {
        const v = (p.usage[s] || {})[mk] || "";
        rows += `
          <div class="sc-row">
            <span class="sc-name">${esc(materials[mk].name||mk)}</span>
            <div class="sc-inputs">
              <input type="number" step="0.01" min="0" value="${v}"
                oninput="setUsage('${esc(s)}','${mk}',this.value)">
              <span class="sc-gram">克</span>
              <span class="sc-batch" id="batch-${esc(s)}-${mk}"></span>
              <span class="sc-cost" id="cost-${esc(s)}-${mk}">—</span>
            </div>
          </div>`;
      }
      rows += `<div class="sc-group-subtotal" id="gsub2-${esc(s)}-${esc(g)}"></div></div>`;
    }
    card.innerHTML = `
      <div class="sc-head">
        <span class="sc-title">${esc(s)}g</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="sc-total-cost" id="total-${esc(s)}">—</span>
          <span class="x" style="cursor:pointer;color:var(--muted);font-size:14px" onclick="deleteSpec('${esc(s)}')" title="删除此规格">✕</span>
        </span>
      </div>
      ${rows}
      <div class="sc-total">
        <span class="sc-t-label">单个合计</span>
        <span class="sc-t-val" id="totalval-${esc(s)}">— <small>元/个</small></span>
      </div>
    `;
    cards.appendChild(card);
  }
}

// ================= 操作 =================
function newProduct() {
  const name = prompt("新产品名称：", "新产品");
  if (!name) return;
  const key = "p" + Date.now();
  products[key] = { name, specs: ["50"], usage: {} };
  currentProduct = key;
  scheduleSave();
  renderAll();
}

function deleteProduct() {
  if (!currentProduct) return;
  const p = products[currentProduct];
  if (!confirm(`确定删除产品「${p.name}」？此操作不可恢复。`)) return;
  delete products[currentProduct];
  currentProduct = Object.keys(products)[0] || null;
  scheduleSave();
  renderAll();
}

function switchProduct(key) {
  currentProduct = key || null;
  renderAll();
}

function onProductNameChange(v) {
  if (!currentProduct) return;
  products[currentProduct].name = v;
  scheduleSave();
  renderProductSelect();
}

function addMaterial() {
  showPrompt("添加物料", "输入物料名称：", (name) => {
    if (!name || !name.trim()) return;
    showPrompt("分组", "输入分组名（如：饼皮、内馅、其他）：", (group) => {
      const g = (group || "其他").trim() || "其他";
      const key = "m" + Date.now();
      materials[key] = { name: name.trim(), unit: "袋", price: "", weight: "", group: g };
      if (!matGroups.includes(g)) matGroups.push(g);
      scheduleSave();
      renderMaterials();
      renderRecipe();
      calc();
      // 询问是否同步
      showConfirm(
        "同步用量",
        `是否将「${name.trim()}」同步到各产品的规格用量里？`,
        () => {
          for (const pk of Object.keys(products)) {
            const p = products[pk];
            for (const s of p.specs) {
              if (!p.usage[s]) p.usage[s] = {};
              if (p.usage[s][key] === undefined) p.usage[s][key] = "";
            }
          }
          scheduleSave();
          renderRecipe();
          calc();
        }
      );
    }, "饼皮", "", "text");
  }, "如：蛋黄", "", "text");
}

function deleteMaterial(k) {
  if (!materials[k]) return;
  showConfirm(
    "删除物料",
    `确定删除物料「${materials[k].name}」？所有产品里的用量也会清除。`,
    () => {
      delete materials[k];
      for (const p of Object.values(products)) {
        for (const s of Object.keys(p.usage || {})) {
          delete p.usage[s][k];
        }
      }
      scheduleSave();
      renderMaterials();
      renderRecipe();
      calc();
    },
    "删除"
  );
}

function moveMaterial(k, dir) {
  const keys = Object.keys(materials);
  const idx = keys.indexOf(k);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= keys.length) return;
  // 交换位置（重建对象保持顺序）
  const newOrder = [...keys];
  newOrder[idx] = newOrder[newIdx];
  newOrder[newIdx] = k;
  const reordered = {};
  for (const key of newOrder) reordered[key] = materials[key];
  materials = reordered;
  scheduleSave();
  renderMaterials();
  renderRecipe();
  calc();
}

function changeGroup(k, newGroup) {
  if (!materials[k]) return;
  materials[k].group = newGroup;
  // 如果是新分组，加到分组列表
  if (!matGroups.includes(newGroup)) matGroups.push(newGroup);
  scheduleSave();
  renderMaterials();
  renderRecipe();
  calc();
}

// ================= 自定义弹窗 =================
function showModal({ title, body, options, input, confirm, onConfirm, onCancel }) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  
  let html = `<div class="modal-box">
    <div class="modal-title">${esc(title)}</div>`;
  if (body) html += `<div class="modal-body">${body}</div>`;
  
  if (options) {
    html += `<div class="modal-options">`;
    options.forEach((opt, i) => {
      html += `<button class="modal-opt" data-opt="${i}"><span class="opt-num">${i+1}</span>${esc(opt)}</button>`;
    });
    html += `</div>`;
  }
  
  if (input) {
    html += `<div class="modal-input-row" ${input.showOnOption !== undefined ? 'style="display:none"' : ''}>
      <input type="${input.type || 'text'}" id="modalInput" placeholder="${esc(input.placeholder || '')}" value="${esc(input.value || '')}">
    </div>`;
  }
  
  // 按钮区
  let actionsHtml = `<button class="modal-btn secondary" id="modalCancel">${confirm ? '取消' : '关闭'}</button>`;
  if (confirm) {
    actionsHtml += `<button class="modal-btn primary" id="modalOk">${confirm.okText || '确定'}</button>`;
  } else if (!options) {
    actionsHtml += `<button class="modal-btn primary" id="modalOk">确定</button>`;
  }
  html += `<div class="modal-actions">${actionsHtml}</div></div>`;
  
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  
  // 选项按钮
  if (options) {
    overlay.querySelectorAll(".modal-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        const optIdx = parseInt(btn.dataset.opt);
        // 高亮选中
        overlay.querySelectorAll(".modal-opt").forEach(b => b.style.borderColor = "");
        btn.style.borderColor = "var(--accent)";
        
        // 如果选的是需要输入框的选项
        if (input && input.showOnOption === optIdx) {
          const inputRow = overlay.querySelector(".modal-input-row");
          if (inputRow) inputRow.style.display = "flex";
          // 加确认按钮
          const actions = overlay.querySelector(".modal-actions");
          if (!actions.querySelector("#modalConfirmOpt")) {
            const confirmBtn = document.createElement("button");
            confirmBtn.className = "modal-btn primary";
            confirmBtn.id = "modalConfirmOpt";
            confirmBtn.textContent = "确认";
            confirmBtn.addEventListener("click", () => {
              const val = document.getElementById("modalInput")?.value || "";
              overlay.remove();
              if (onConfirm) onConfirm({ option: optIdx, value: val });
            });
            actions.appendChild(confirmBtn);
          }
          document.getElementById("modalInput")?.focus();
        } else {
          // 直接确认
          overlay.remove();
          if (onConfirm) onConfirm({ option: optIdx, value: null });
        }
      });
    });
  }
  
  // 取消/关闭
  overlay.querySelector("#modalCancel").addEventListener("click", () => {
    overlay.remove();
    if (onCancel) onCancel();
  });
  
  // 确定（confirm 模式或无选项模式）
  const okBtn = overlay.querySelector("#modalOk");
  if (okBtn) {
    okBtn.addEventListener("click", () => {
      const val = document.getElementById("modalInput")?.value || "";
      overlay.remove();
      if (onConfirm) onConfirm({ option: null, value: val });
    });
  }
  
  // 点击遮罩关闭
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) {
      overlay.remove();
      if (onCancel) onCancel();
    }
  });
  
  // 键盘
  overlay.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      overlay.remove();
      if (onCancel) onCancel();
    }
  });
  
  return overlay;
}

// 便捷函数
function showConfirm(title, body, onOk, okText) {
  showModal({
    title, body,
    confirm: { okText },
    onConfirm: () => onOk(),
    onCancel: () => {}
  });
}

function showPrompt(title, body, onOk, placeholder, defaultValue, inputType) {
  showModal({
    title, body,
    input: { type: inputType || 'text', placeholder, value: defaultValue || '' },
    confirm: { okText: '确定' },
    onConfirm: ({ value }) => onOk(value),
    onCancel: () => {}
  });
}

function syncMaterialUsage(k) {
  if (!materials[k]) return;
  const name = materials[k].name;
  const prodKeys = Object.keys(products);
  if (prodKeys.length === 0) { alert("没有产品"); return; }
  
  // 用自定义弹窗
  const overlay = showModal({
    title: `同步「${name}」到所有规格`,
    body: "选择同步方式：",
    options: [
      "按首个规格比例自动填充",
      "固定用量（所有规格用同一个值）",
      "留空，自己填"
    ],
    input: {
      type: "number",
      placeholder: "输入固定用量（克）",
      showOnOption: 1  // 选第2个选项时显示
    },
    onConfirm: (val) => {
      // 这个不会用到，因为有选项
    },
    onCancel: () => {}
  });
  
  // 监听选项点击
  let selectedOpt = -1;
  overlay.querySelectorAll(".modal-opt").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedOpt = parseInt(btn.dataset.opt);
      // 如果是固定用量，显示输入框并等待确认
      if (selectedOpt === 1) {
        const inputRow = overlay.querySelector(".modal-input-row");
        if (inputRow) {
          inputRow.style.display = "flex";
          // 加一个确认按钮
          const actions = overlay.querySelector(".modal-actions");
          if (!actions.querySelector("#modalConfirmOpt")) {
            const confirmBtn = document.createElement("button");
            confirmBtn.className = "modal-btn primary";
            confirmBtn.id = "modalConfirmOpt";
            confirmBtn.textContent = "确认同步";
            confirmBtn.addEventListener("click", () => {
              const inputEl = document.getElementById("modalInput");
              const fixedVal = parseFloat(inputEl?.value);
              if (isNaN(fixedVal) || fixedVal < 0) {
                inputEl?.focus();
                return;
              }
              doSync(k, 1, fixedVal);
              overlay.remove();
            });
            actions.appendChild(confirmBtn);
          }
          document.getElementById("modalInput")?.focus();
        }
      } else {
        // 直接同步
        doSync(k, selectedOpt, null);
        overlay.remove();
      }
    });
  });
}

function doSync(k, mode, fixedVal) {
  const name = materials[k].name;
  for (const pk of Object.keys(products)) {
    const p = products[pk];
    if (p.specs.length === 0) continue;
    
    if (mode === 0) {
      // 按比例
      const base = p.specs[0];
      const baseVal = parseFloat((p.usage[base] || {})[k]);
      if (isNaN(baseVal) || baseVal <= 0) {
        alert(`「${p.name}」的首个规格（${base}g）没有填「${name}」的用量，无法按比例填充。`);
        return;
      }
      for (const s of p.specs) {
        if (s === base) continue;
        const ratio = parseFloat(s) / parseFloat(base);
        if (!isNaN(ratio) && ratio > 0) {
          if (!p.usage[s]) p.usage[s] = {};
          p.usage[s][k] = Math.round(baseVal * ratio * 100) / 100;
        }
      }
    } else if (mode === 1) {
      // 固定用量
      for (const s of p.specs) {
        if (!p.usage[s]) p.usage[s] = {};
        p.usage[s][k] = fixedVal;
      }
    } else {
      // 留空
      for (const s of p.specs) {
        if (!p.usage[s]) p.usage[s] = {};
        if (p.usage[s][k] === undefined) {
          p.usage[s][k] = "";
        }
      }
    }
  }
  scheduleSave();
  renderRecipe();
  calc();
}

function manageGroups() {
  const list = matGroups.map((g, i) => `${i+1}. ${g}`).join("<br>");
  showModal({
    title: "管理分组",
    body: `当前分组：<br>${list || "（无分组）"}`,
    options: ["添加新分组", "删除分组", "重命名分组"],
    onConfirm: ({ option }) => {
      if (option === 0) {
        // 添加
        showPrompt("添加分组", "输入新分组名：", (name) => {
          if (!name || !name.trim()) return;
          const g = name.trim();
          if (matGroups.includes(g)) { alert("分组已存在"); return; }
          matGroups.push(g);
          scheduleSave();
          renderMaterials();
          renderRecipe();
          calc();
        }, "如：装饰", "", "text");
      } else if (option === 1) {
        // 删除
        const opts = matGroups.map(g => g);
        showModal({
          title: "删除分组",
          body: "选择要删除的分组：",
          options: opts,
          onConfirm: ({ option: idx }) => {
            const g = opts[idx];
            const hasMats = Object.values(materials).some(m => (m.group || "其他") === g);
            if (hasMats) { alert(`分组「${g}」还有物料，不能删除。先把物料移到其他分组。`); return; }
            matGroups = matGroups.filter(x => x !== g);
            scheduleSave();
            renderMaterials();
            renderRecipe();
            calc();
          }
        });
      } else if (option === 2) {
        // 重命名
        const opts = matGroups.map(g => g);
        showModal({
          title: "重命名分组",
          body: "选择要重命名的分组：",
          options: opts,
          onConfirm: ({ option: idx }) => {
            const oldName = opts[idx];
            showPrompt("重命名", `将「${oldName}」改为：`, (newName) => {
              if (!newName || !newName.trim()) return;
              const g = newName.trim();
              if (g === oldName) return;
              if (matGroups.includes(g)) { alert("新分组名已存在"); return; }
              for (const k of Object.keys(materials)) {
                if ((materials[k].group || "其他") === oldName) {
                  materials[k].group = g;
                }
              }
              matGroups = matGroups.map(x => x === oldName ? g : x);
              scheduleSave();
              renderMaterials();
              renderRecipe();
              calc();
            }, "新分组名", "", "text");
          }
        });
      }
    }
  });
}

function addSpec() {
  if (!currentProduct) { alert("先新建产品"); return; }
  const p = products[currentProduct];
  showPrompt("添加规格", "输入规格（克）：", (v) => {
    if (!v || !v.trim()) return;
    const s = v.trim();
    if (p.specs.includes(s)) { alert("规格已存在"); return; }
    p.specs.push(s);
    p.usage[s] = {};
    // 询问是否同步
    if (p.specs.length >= 2) {
      showConfirm(
        "同步用量",
        `是否按「${p.specs[0]}g」的用量比例自动填充「${s}g」？\n\n（比例 = ${s} ÷ ${p.specs[0]}）`,
        () => {
          const base = p.specs[0];
          const ratio = parseFloat(s) / parseFloat(base);
          if (!isNaN(ratio) && ratio > 0) {
            for (const mk of Object.keys(materials)) {
              const bv = parseFloat((p.usage[base] || {})[mk]);
              if (!isNaN(bv) && bv > 0) {
                p.usage[s][mk] = Math.round(bv * ratio * 100) / 100;
              }
            }
          }
          scheduleSave();
          renderRecipe();
          calc();
        }
      );
    } else {
      scheduleSave();
      renderRecipe();
      calc();
    }
  }, "50", "", "text");
}

function renameSpec(oldS, newS) {
  if (!currentProduct) return;
  const p = products[currentProduct];
  newS = newS.trim();
  if (!newS || newS === oldS) return;
  if (p.specs.includes(newS)) { alert("规格已存在"); renderRecipe(); return; }
  p.specs = p.specs.map(s => s === oldS ? newS : s);
  if (p.usage[oldS]) {
    p.usage[newS] = p.usage[oldS];
    delete p.usage[oldS];
  }
  scheduleSave();
  renderRecipe();
  calc();
}

function deleteSpec(s) {
  if (!currentProduct) return;
  const p = products[currentProduct];
  showConfirm(
    "删除规格",
    `确定删除规格 ${s}g？`,
    () => {
      p.specs = p.specs.filter(x => x !== s);
      delete p.usage[s];
      scheduleSave();
      renderRecipe();
      calc();
    },
    "删除"
  );
}

function moveSpec(s, dir) {
  if (!currentProduct) return;
  const p = products[currentProduct];
  const idx = p.specs.indexOf(s);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= p.specs.length) return;
  // 交换位置
  p.specs[idx] = p.specs[newIdx];
  p.specs[newIdx] = s;
  scheduleSave();
  renderRecipe();
  calc();
}

function onBatchChange(v) {
  calc();
}

function setUsage(spec, matKey, v) {
  if (!currentProduct) return;
  const p = products[currentProduct];
  if (!p.usage[spec]) p.usage[spec] = {};
  p.usage[spec][matKey] = v;
  scheduleSave();
  calc();
}

// ================= 计算 =================
function getBatch() {
  const el = document.getElementById("batchCount");
  const n = parseInt(el ? el.value : "1");
  return (n && n > 0) ? n : 1;
}

function calc() {
  updateUnitPrices();
  const p = currentProduct ? products[currentProduct] : null;
  const grid = document.getElementById("summaryGrid");
  grid.innerHTML = "";
  if (!p) return;

  const batch = getBatch();
  const totals = {};
  const groups = matGroups.length ? matGroups : ["其他"];
  for (const s of p.specs) {
    let total = 0;
    let valid = false;
    // 按分组算小计
    const groupSubtotals = {};
    for (const g of groups) {
      let gTotal = 0;
      let gValid = false;
      const gMats = Object.keys(materials).filter(mk => (materials[mk].group || "其他") === g);
      for (const mk of gMats) {
        const up = unitPrice(mk);
        const g_ = parseFloat((p.usage[s] || {})[mk]);
        const cell = document.getElementById(`cost-${s}-${mk}`);
        const batchCell = document.getElementById(`batch-${s}-${mk}`);
        if (up && !isNaN(g_) && g_ > 0) {
          const c = up * g_;
          gTotal += c;
          gValid = true;
          if (cell) cell.textContent = c.toFixed(4);
          if (batchCell) {
            batchCell.textContent = batch > 1 ? `(${(g_*batch).toFixed(1)}克)` : "";
          }
        } else if (cell) {
          cell.textContent = "—";
          if (batchCell) batchCell.textContent = "";
        }
      }
      groupSubtotals[g] = gValid ? gTotal : null;
      total += gTotal;
      if (gValid) valid = true;
      // 更新分组小计显示
      const gsub = document.getElementById(`gsub2-${s}-${g}`);
      if (gsub) gsub.textContent = gValid ? `${g}小计: ${gTotal.toFixed(4)} 元` : "";
    }
    totals[s] = valid ? total : null;
    // 卡片头部的合计
    const tc = document.getElementById("total-" + s);
    if (tc) tc.textContent = valid ? total.toFixed(4) + " 元" : "—";
    // 卡片底部的合计（带批量）
    const tv = document.getElementById("totalval-" + s);
    const label = document.querySelector(`#specCards .spec-card:nth-child(${p.specs.indexOf(s)+1}) .sc-t-label`);
    if (tv) {
      if (valid) {
        const batchTotal = total * batch;
        tv.innerHTML = batchTotal.toFixed(2) + " <small>元/" + batch + "个</small>";
        if (label) label.textContent = batch > 1 ? "合计" : "单个合计";
      } else {
        tv.innerHTML = "— <small>元/个</small>";
        if (label) label.textContent = "单个合计";
      }
    }
  }

  // 汇总卡片
  const validTotals = Object.entries(totals).filter(([, v]) => v !== null);
  let min = Infinity;
  for (const [, v] of validTotals) if (v < min) min = v;

  for (const s of p.specs) {
    const v = totals[s];
    const div = document.createElement("div");
    div.className = "summary-item" + (v !== null && v === min && validTotals.length > 1 ? " lowest" : "");
    const batchTotal = v !== null ? (v * batch).toFixed(2) : "—";
    div.innerHTML = `
      <div class="spec">${esc(s)}g</div>
      <div class="cost">${v !== null ? v.toFixed(4) : "—"} <small>元/个</small></div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${batchTotal} 元/${batch}个</div>
      ${v !== null && v === min && validTotals.length > 1 ? '<div class="badge">最低</div>' : ""}
    `;
    grid.appendChild(div);
  }
}

// ================= Excel 导出 =================
async function exportExcel() {
  if (!currentProduct) { alert("先新建产品"); return; }
  const btn = document.querySelector(".btn-good");
  const orig = btn.textContent;
  btn.textContent = "导出中...";
  btn.disabled = true;
  try {
    saveAll();
    await new Promise(r => setTimeout(r, 1000));
    const res = await fetch("/api/export?product=" + encodeURIComponent(currentProduct));
    if (!res.ok) throw new Error("http " + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (products[currentProduct].name || "product") + "成本表.xlsx";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent = "已导出";
  } catch (e) {
    alert("导出失败: " + e.message);
    btn.textContent = orig;
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
}

function clearAll() {
  if (!confirm("确定清空所有物料和产品？此操作不可恢复！")) return;
  materials = {};
  products = {};
  currentProduct = null;
  scheduleSave();
  renderAll();
}

// ================= 工具 =================
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadAll();
